<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101d15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Villager</title>
<link rel="manifest" href="./manifest.webmanifest?v=625">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon.svg">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d15;font-family:system-ui;color:white;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit}
canvas{display:block;position:fixed;inset:0;z-index:0}
#status{position:fixed;left:8px;top:8px;padding:4px 7px;background:#17251dcc;border:1px solid #8a7048;border-radius:7px;z-index:20;pointer-events:none;font:700 10px system-ui;line-height:13px;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
#material-hud{position:fixed;left:8px;top:34px;padding:4px 7px;background:#17251dcc;border:1px solid #58735d;border-radius:7px;z-index:20;font:800 9px system-ui;line-height:12px;letter-spacing:.2px;pointer-events:none;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
#gameplay-feedback{position:fixed;left:50%;top:68px;transform:translate(-50%,-8px);padding:6px 10px;border-radius:8px;background:#17251ddd;border:1px solid #8a7048;z-index:35;opacity:0;transition:opacity .12s ease,transform .12s ease;pointer-events:none;font:800 11px system-ui}
#gameplay-feedback.show{opacity:1;transform:translate(-50%,0)}
.stick{position:fixed;left:0;top:0;width:124px;height:124px;border:4px solid #3a2b21;border-radius:50%;background:#203d28aa;z-index:18;pointer-events:none;opacity:0;visibility:hidden;transform:translate(-50%,-50%) scale(.88);transition:opacity .06s ease,transform .06s ease;box-shadow:0 3px 10px #00000022}
.stick.active{opacity:.78;visibility:visible;transform:translate(-50%,-50%) scale(1)}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;transform:translate(-50%,-50%);background:#d2ae69;border:4px solid #3a2b21;box-shadow:inset 0 0 12px #ffffff35}
.eye{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;pointer-events:none}
.game-button{position:fixed;bottom:22px;width:70px;height:70px;border:4px solid #3a2b21;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#d2ae69dd;color:#3a2b21;font:800 12px system-ui;letter-spacing:.2px;z-index:30;touch-action:none;box-shadow:inset 0 0 12px #ffffff35,0 3px 9px #00000028;padding:0}
.game-button:active,.game-button.pressed{transform:scale(.92);background:#e3c782}
.game-button:disabled{filter:saturate(.55);opacity:.55}
.game-button.hidden-action{opacity:0;pointer-events:none}
#jump-button{right:18px;bottom:18px;width:64px;height:64px}
#sprint-button{right:26px!important;bottom:92px!important;width:46px!important;height:46px!important;min-width:46px!important;min-height:46px!important;background:#9abf79dd;display:flex!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;z-index:46}
#action-button{right:92px;bottom:21px;width:58px;height:58px;min-width:58px}
#jump-button,#sprint-button,#action-button{font-size:0!important;letter-spacing:0}
#jump-button::before,#sprint-button::before{content:none!important;display:none!important}
#action-button::before{display:block;line-height:1;font-family:Arial,sans-serif;font-weight:900;pointer-events:none;content:'✦';font-size:27px}
#jump-button .jump-icon{width:34px;height:34px;display:block;pointer-events:none;background:currentColor;-webkit-mask:url('./assets/ui/icons/actions/jump.svg?v=638') center/contain no-repeat;mask:url('./assets/ui/icons/actions/jump.svg?v=638') center/contain no-repeat}
#sprint-button .sprint-icon{width:31px;height:31px;display:block;pointer-events:none;background:currentColor;-webkit-mask:url('./assets/ui/icons/actions/sprint.svg?v=638') center/contain no-repeat;mask:url('./assets/ui/icons/actions/sprint.svg?v=638') center/contain no-repeat}
#build-mode-button{display:none!important;right:186px;background:#9abf79dd;font-size:10px}
#build-mode-button[data-build-mode="frame"]{background:#c7a974dd}
#build-mode-button[data-build-mode="wall"]{background:#b98b63dd}
#build-mode-button[data-build-mode="angle"]{background:#c79d6bdd}
#build-mode-button[data-build-mode="raw"]{background:#91aa7bdd}
#stamina-hud{position:fixed;right:92px;bottom:122px;width:116px;height:11px;padding:2px;border:2px solid #3a2b21;border-radius:8px;background:#17251dcc;z-index:29;pointer-events:none;opacity:0;transform:translateY(5px);transition:opacity .2s ease,transform .2s ease;overflow:hidden}
#stamina-hud.visible{opacity:.94;transform:translateY(0)}
#stamina-fill{width:100%;height:100%;border-radius:5px;background:#d2ae69;transform-origin:left center;transform:scaleX(1);transition:transform .07s linear}
#stamina-hud.depleted #stamina-fill{background:#9b6548}
@media(max-width:620px){
 #status{font-size:9px;line-height:12px;max-width:150px}
 #material-hud{font-size:8px;line-height:11px;max-width:140px}
 .stick{width:112px;height:112px}
 .knob{width:52px;height:52px}
 .game-button{bottom:18px}
 #jump-button{right:16px;bottom:16px;width:60px;height:60px}
 #sprint-button{right:24px!important;bottom:86px!important;width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important}
 #action-button{right:84px;bottom:19px;width:54px;height:54px;min-width:54px}
 #jump-button .jump-icon{width:32px;height:32px}
 #sprint-button .sprint-icon{width:29px;height:29px}
 #action-button::before{font-size:25px}
 #build-mode-button{right:164px;font-size:9px}
 #stamina-hud{right:76px;bottom:103px;width:102px;height:10px}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}}</script>
</head>
<body>
<div id="status">0.6.11 · loading</div>
<div id="material-hud">HANDS EMPTY · gather and place raw materials</div>
<div id="gameplay-feedback"></div>
<div id="stamina-hud" role="progressbar" aria-label="Stamina" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="stamina-fill"></div></div>
<div id="move-stick" class="stick"><div id="move-knob" class="knob"></div></div>
<div id="look-stick" class="stick"><div id="look-knob" class="knob"></div><div class="eye">👁️</div></div>
<button id="build-mode-button" class="game-button" data-game-ui="true" data-build-mode="raw" type="button" aria-label="Legacy log construction mode">RAW</button>
<button id="action-button" class="game-button hidden-action" data-game-ui="true" type="button" aria-label="Interact" disabled>USE</button>
<button id="sprint-button" class="game-button" data-game-ui="true" type="button" aria-label="Sprint"><span class="sprint-icon" aria-hidden="true"></span></button>
<button id="jump-button" class="game-button" data-game-ui="true" type="button" aria-label="Jump"><span class="jump-icon" aria-hidden="true"></span></button>
<script>(()=>{const release=async()=>{try{screen.orientation?.unlock?.()}catch{}try{await screen.orientation?.lock?.('any')}catch{}setTimeout(()=>dispatchEvent(new Event('resize')),0)};addEventListener('pageshow',release);addEventListener('orientationchange',()=>setTimeout(release,50));})();</script>
<script type="module" src="./src/main.js?v=643"></script>
</body>
</html>
